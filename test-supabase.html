
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>TI Secret Factions - Test Supabase</title>
</head>
<body>
  <h1>TI Secret Factions</h1>
  <h2>Test collegamento Supabase</h2>

  <p id="result">Test non ancora avviato.</p>

  <button id="testButton">
    Verifica collegamento
  </button>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    // Sostituiremo questi valori nel prossimo passaggio
    const SUPABASE_URL = 'https://hzwgpjtlvvjdryoiwbcf.supabase.co/';
    const SUPABASE_KEY = 'sb_publishable_64zz7c3qQsFv3eUiKmiPvg_QiaLwEt6';
    

    const result = document.getElementById('result');
    const button = document.getElementById('testButton');

    button.addEventListener('click', async () => {
      result.textContent = 'Collegamento in corso...';

      try {
        const supabase = createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } =
          await supabase.auth.signInAnonymously();

        if (error) {
          throw error;
        }

        result.textContent =
          'Accesso anonimo riuscito! ID giocatore: ' +
          data.user.id;

      } catch (error) {
        result.textContent =
          'Errore: ' + error.message;
      }
    });
  </script>

<hr>

<h2>Crea una partita di prova</h2>

<button id="createGameButton">
  Crea partita di prova
</button>

<p id="gameResult"></p>

<script type="module">
  import { createClient } from
    'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://hzwgpjtlvvjdryoiwbcf.supabase.co',
    'sb_publishable_64zz7c3qQsFv3eUiKmiPvg_QiaLwEt6'
  );

  const button =
    document.getElementById('createGameButton');

  const result =
    document.getElementById('gameResult');

  button.addEventListener('click', async () => {
    button.disabled = true;
    result.textContent = 'Creazione in corso...';

    try {
      const { data: sessionData } =
        await supabase.auth.getSession();

      if (!sessionData.session) {
        const { error: signInError } =
          await supabase.auth.signInAnonymously();

        if (signInError) throw signInError;
      }

      const scheduledAt = new Date(
        Date.now() + 72 * 60 * 60 * 1000
      ).toISOString();

      const { data, error } = await supabase.rpc(
        'create_game',
        {
          p_title: 'Partita di prova',
          p_scheduled_at: scheduledAt,
          p_player_name: 'Giocatore Test'
        }
      );

      if (error) throw error;

      const game = data?.[0];

      if (!game) {
        throw new Error('Nessuna partita restituita');
      }

      result.textContent =
        'Partita creata! Codice invito: ' +
        game.invite_code;

    } catch (error) {
      result.textContent =
        'Errore: ' + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>

  
<hr>

<h2>Entra in una partita</h2>

<input
  id="inviteCode"
  placeholder="Codice invito"
  maxlength="8"
>

<input
  id="playerName"
  placeholder="Nome giocatore"
  value="Giocatore 2"
>

<button id="joinGameButton">
  Entra nella partita
</button>

<p id="joinResult"></p>

<script type="module">
  import { createClient } from
    'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://hzwgpjtlvvjdryoiwbcf.supabase.co',
    'sb_publishable_64zz7c3qQsFv3eUiKmiPvg_QiaLwEt6'
  );

  document.getElementById('joinGameButton')
    .addEventListener('click', async () => {

      const result =
        document.getElementById('joinResult');

      result.textContent = 'Ingresso in corso...';

      try {
        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          const { error: authError } =
            await supabase.auth.signInAnonymously();

          if (authError) throw authError;
        }

        const code = document
          .getElementById('inviteCode')
          .value.trim().toUpperCase();

        const name = document
          .getElementById('playerName')
          .value.trim();

        const { data, error } =
          await supabase.rpc('join_game', {
            p_invite_code: code,
            p_player_name: name
          });

        if (error) throw error;

        const game = data?.[0];

        if (!game) {
          throw new Error(
            'Nessuna partita restituita'
          );
        }

        result.textContent =
          'Ingresso riuscito! Partita: ' +
          game.game_title;

      } catch (error) {
        result.textContent =
          'Errore: ' + error.message;
      }
    });
</script>


  
</body>
</html>
